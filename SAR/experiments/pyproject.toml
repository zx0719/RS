[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-intel-pipeline"
version = "0.1.0"
description = "Modular SAR intelligence report pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
geo = [
    "rasterio>=1.3,<2",
]
det = [
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "ultralytics>=8.0,<9",
]
api = [
    "openai>=1.0,<3",
]
llm = [
    "accelerate>=0.27,<2",
    "torch>=2.4,<2.5",
    "transformers>=4.40,<5",
]
dev = [
    "ipykernel>=6",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
notebook = [
    "jupyter>=1",
]
all = [
    "accelerate>=0.27,<2",
    "ipykernel>=6",
    "jupyter>=1",
    "openai>=1.0,<3",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "rasterio>=1.3,<2",
    "torch>=2.4,<2.5",
    "torchvision>=0.19,<0.20",
    "transformers>=4.40,<5",
    "ultralytics>=8.0,<9",
]

[tool.setuptools.packages.find]
include = ["modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
